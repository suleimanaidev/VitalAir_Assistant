services:
  - type: web
    name: vitalair-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false
      - key: WAQI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VITALAIR_JWT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: USE_MOCK_AGENTS
        value: "false"
